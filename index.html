<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa dos Reis</title>
<meta name="description" content="Ranking comunitário de builds de 9 Kings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23e3b541' d='M0 1h1v1H0zM9 1h1v1H9zM4 0h2v1H4zM0 2h2v4H0zM8 2h2v4H8zM4 1h2v5H4zM2 3h2v3H2zM6 3h2v3H6z'/%3E%3Cpath fill='%23b3861f' d='M0 6h10v2H0z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#12141c;
  --ground-2:#181b26;
  --panel:#1e2230;
  --panel-2:#262b3c;
  --line:#343a50;
  --ink:#ece6d6;
  --ink-2:#aaa596;
  --ink-3:#7d7a70;
  --gold:#e3b541;
  --gold-ink:#1b1606;
  --good:#6cc46a;
  --bad:#e0605f;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --k-nothing:#cbbf95; --k-spells:#8795ff; --k-greed:#e6c13b; --k-blood:#e0505a;
  --k-nature:#6cc46a; --k-nomads:#e0913f; --k-stone:#a3acb7; --k-progress:#44c6cd; --k-time:#bb84e6;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 64px;
  background-image:radial-gradient(circle at 50% -20%, #232a44 0, transparent 55%);}
.wrap{max-width:1080px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(18,20,28,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.crown{width:30px;height:24px;image-rendering:pixelated}
.brand b{font-family:var(--display);font-size:22px;font-weight:700}
.brand small{font-size:13px;color:var(--ink-3);display:block;line-height:1}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.who{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.who img{width:26px;height:26px;border-radius:50%}
.who strong{color:var(--ink)}

/* hero */
.hero{padding-block:36px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(30px,5vw,46px);max-width:18ch}
.hero p{margin:0;color:var(--ink-2);max-width:60ch}

.notice{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--ink-2);font-size:15px;margin-block:12px}

/* filters */
.filters{display:grid;gap:12px;margin-block:18px 14px}
.kings{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ground-2);border-radius:999px;padding:5px 12px;font-size:15px;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chip .dot{width:9px;height:9px;border-radius:2px;background:var(--kc,var(--ink-3))}
.chip[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--kc,var(--gold))}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.field{background:var(--ground-2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0}
.row2 .field.search{flex:1 1 240px}

/* ranking list */
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.lh,.li{display:grid;grid-template-columns:52px 78px 1fr 150px 120px;gap:14px;align-items:center;padding:12px 16px}
.lh{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--ground-2);border-bottom:1px solid var(--line)}
.li{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;color:var(--ink)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel-2)}
.rank{font-family:var(--display);font-size:22px;color:var(--ink-3)}
.li.top .rank{color:var(--gold)}
.score{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px}
.score .tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid var(--good)}
.score.neg .tri{border-bottom:0;border-top:9px solid var(--bad)}
.ttl{min-width:0}
.ttl b{display:block;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.ttl span{display:block;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbadge{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);white-space:nowrap}
.kbadge i{width:12px;height:12px;border-radius:3px;background:var(--kc);box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}
.meta{font-size:14px;color:var(--ink-2);line-height:1.3}
.meta small{display:block;color:var(--ink-3)}
.tag-ex{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink-3);color:var(--ink-2);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
@media (max-width:760px){
  .lh{display:none}
  .li{grid-template-columns:40px 1fr auto;grid-template-areas:"rank ttl score" "rank king meta";row-gap:6px}
  .li .rank{grid-area:rank}.li .ttl{grid-area:ttl}.li .score{grid-area:score;justify-self:end}
  .li .kcol{grid-area:king}.li .meta{grid-area:meta;text-align:right}
}

/* build page */
.back{background:none;border:0;color:var(--ink-2);padding:0;margin-block:22px 10px;font-size:15px}
.back:hover{color:var(--ink)}
.bhead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;padding-bottom:18px;border-bottom:1px solid var(--line)}
.bhead h1{font-size:clamp(28px,4.4vw,40px);overflow-wrap:anywhere}
.bsub{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;color:var(--ink-2);font-size:15px}
.voter{display:grid;justify-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:74px}
.voter button{background:transparent;border:1px solid transparent;border-radius:6px;width:44px;height:30px;display:grid;place-items:center;color:var(--ink-3)}
.voter button:hover{border-color:var(--line);color:var(--ink)}
.voter button[aria-pressed="true"].up{color:var(--good);border-color:var(--good)}
.voter button[aria-pressed="true"].down{color:var(--bad);border-color:var(--bad)}
.voter .num{font-size:24px}
.voter small{font-size:12px;color:var(--ink-3)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:24px}
@media (max-width:860px){.bgrid{grid-template-columns:1fr}.bhead{grid-template-columns:1fr}.voter{grid-auto-flow:column;justify-self:start;align-items:center}}
.sec{display:grid;gap:10px;margin-bottom:26px}
.sec h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.summary{font-size:19px;color:var(--ink);margin:0;max-width:62ch}
.guide p{margin:0 0 12px;max-width:66ch;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.side{display:grid;gap:22px;align-content:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.perk{border:1px solid var(--line);background:var(--ground-2);border-radius:6px;padding:4px 10px;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;border-radius:4px;padding:2px 8px;background:var(--panel-2);color:var(--ink-2)}
.owner-actions{display:flex;gap:8px;flex-wrap:wrap}

/* kingdom grid */
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#0d0f15;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:440px;width:100%}
.cell{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px dashed #2c3144;background:#161925;display:grid;place-items:center;text-align:center;padding:3px;font-size:12px;line-height:1.1;color:var(--ink-3);position:relative;overflow:hidden}
.cell.full{border:1px solid var(--kc);background:linear-gradient(180deg, color-mix(in srgb, var(--kc) 26%, #1a1d29), #171a25);color:var(--ink);font-weight:500}
.cell.full::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--kc)}
.cell.center{outline:2px solid var(--gold);outline-offset:-2px}
.cell span{overflow-wrap:anywhere;hyphens:auto}
.cell .lv{position:absolute;bottom:2px;right:4px;font-family:var(--display);font-size:11px;color:var(--gold)}
button.cell{cursor:pointer}
button.cell.sel{box-shadow:0 0 0 3px var(--gold)}
.legend{font-size:13px;color:var(--ink-3)}

/* editor */
.form{display:grid;gap:18px;margin-top:10px}
.form label{display:grid;gap:6px;font-weight:500}
.form label small{font-weight:400;color:var(--ink-3)}
.form .field{width:100%}
textarea.field{min-height:180px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.editor-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.editor-grid{grid-template-columns:1fr}}
.palette{display:grid;gap:12px;max-height:520px;overflow:auto;padding-right:4px}
.pgroup{display:grid;gap:6px}
.pgroup h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--kc);font-weight:600}
.pcards{display:flex;flex-wrap:wrap;gap:5px}
.pcard{border:1px solid var(--line);border-left:4px solid var(--kc);background:var(--ground-2);border-radius:5px;padding:4px 9px;font-size:14px}
.pcard:hover{background:var(--panel-2)}
.cellctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--ink-2)}
.err{color:var(--bad);font-size:15px}
.formbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.7);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:440px;width:100%;display:grid;gap:14px}
.modal p{margin:0;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60}
@media (prefers-reduced-motion:no-preference){.li,.btn,.chip{transition:background .12s,border-color .12s}}

/* enchantments */
.cell.enchanted{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 55%, transparent), inset 0 0 14px color-mix(in srgb, var(--gold) 22%, transparent)}
.ench{position:absolute;top:7px;left:4px;display:flex;align-items:center;gap:2px}
.ench i,.echip i,.penc i{display:inline-block;width:7px;height:7px;transform:rotate(45deg);background:var(--ec,var(--kc));border:1px solid #0d0f15;flex:none}
.ench b{font-family:var(--display);font-size:10px;color:var(--gold);margin-left:2px;font-weight:600}
.enchlist{display:grid;gap:8px;margin-top:6px}
.enchlist h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.erow{display:grid;gap:5px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.etroop{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.etroop i{width:10px;height:10px;border-radius:2px;background:var(--kc)}
.etroop small{font-weight:400;color:var(--ink-3)}
.echips{display:flex;flex-wrap:wrap;gap:5px}
.echip{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);background:var(--ground-2);border-radius:5px;padding:2px 8px}
.echip b{font-family:var(--display);color:var(--gold);font-weight:600}
.enchpanel{display:grid;gap:8px;border:1px solid color-mix(in srgb, var(--gold) 45%, var(--line));border-radius:8px;padding:10px 12px;background:var(--panel)}
.erow2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:28px;height:28px;border-radius:5px;border:1px solid var(--line);background:var(--ground-2)}
.stepper b{min-width:2ch;text-align:center}
.enchgroup h3{color:var(--gold)}
.enchgroup h3 small{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400;font-family:var(--body);font-size:13px}
.penc{border-left-width:1px;display:inline-flex;align-items:center;gap:7px;border-style:dashed;border-color:color-mix(in srgb, var(--gold) 50%, var(--line))}
.penc[aria-disabled="true"]{opacity:.55}
.pcard small{display:block;font-size:11px;color:var(--ink-3);line-height:1}
/* drag */
.cell.full[data-cell],.pcard{touch-action:none;user-select:none;-webkit-user-select:none}
.palette .pcard{touch-action:auto}
@media (hover:hover){.palette .pcard{cursor:grab}.cell.full[data-cell]{cursor:grab}}
.dragging{opacity:.4}
.cell.dropover{box-shadow:0 0 0 3px var(--gold);background:color-mix(in srgb, var(--gold) 18%, #161925)}
.dragghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;padding:6px 12px;border-radius:6px;background:var(--panel-2);border:1px solid var(--kc);border-left:4px solid var(--kc);font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dragghost.isench{border-style:dashed;border-color:var(--gold);color:var(--gold)}
/* years */
.yearbar{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.years{display:flex;flex-wrap:wrap;gap:6px;max-width:440px}
.yeartab{font-family:var(--display);font-size:14px;border:1px solid var(--line);background:var(--ground-2);color:var(--ink-2);border-radius:6px;padding:5px 12px}
.yeartab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.yeartab.add{border-style:dashed;color:var(--gold);font-family:var(--body);font-size:14px}
.yearctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.yearctl label{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.yearctl input{width:90px;padding:5px 10px}
.yearnow{color:var(--ink-2);font-size:13px;letter-spacing:.08em}
/* language switch */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--ink-3);font-family:var(--display);font-size:13px;padding:6px 10px}
.lang button[aria-pressed="true"]{background:var(--panel-2);color:var(--gold)}
/* guide images */
.guide .gimg{margin:4px 0 16px;display:grid;gap:6px;max-width:66ch}
.guide .gimg img{border-radius:8px;border:1px solid var(--line);max-width:100%;height:auto;background:var(--ground-2)}
.guide .gimg figcaption{font-size:14px;color:var(--ink-3)}
.guidetools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:-8px}
.gthumbs{display:flex;flex-wrap:wrap;gap:8px}
.gthumbs img{height:72px;width:auto;border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <button class="brand" id="homeBtn" aria-label="Ir para o ranking">
      <svg class="crown" viewBox="0 0 10 8" aria-hidden="true" shape-rendering="crispEdges">
        <rect x="0" y="1" width="1" height="1" fill="#e3b541"/><rect x="9" y="1" width="1" height="1" fill="#e3b541"/><rect x="4" y="0" width="2" height="1" fill="#e3b541"/>
        <rect x="0" y="2" width="2" height="4" fill="#e3b541"/><rect x="8" y="2" width="2" height="4" fill="#e3b541"/><rect x="4" y="1" width="2" height="5" fill="#e3b541"/>
        <rect x="2" y="3" width="2" height="3" fill="#e3b541"/><rect x="6" y="3" width="2" height="3" fill="#e3b541"/><rect x="0" y="6" width="10" height="2" fill="#b3861f"/>
        <rect x="4" y="3" width="2" height="1" fill="#e0505a"/>
      </svg>
      <span><b>Mesa dos Reis</b><small id="brandSub">builds de 9 Kings</small></span>
    </button>
    <span class="sp"></span>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt" aria-pressed="true">PT</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div id="authArea" class="who"></div>
  </div>
</header>

<main class="wrap" id="app"><p class="notice">Carregando… / Loading…</p></main>
<div id="layer"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- Game data (9 Kings) ---------- */
/* cards by type: base, troop, tower, building, ench (enchantment: stacks on a troop), tome (one-shot, not placed) */
const KINGS = [
  {id:"nothing", name:"King of Nothing", pt:"Rei do Nada", color:"var(--k-nothing)",
   c:{base:["Castle"],troop:["Archer","Paladin","Soldier"],tower:["Scout Tower"],building:["Blacksmith","Farm"],ench:["Steel Coat"],tome:["Wildcard"]},
   perks:["Agricultural","Berserk","Farsighted","Mauler","Protector","Recruiter","Sentinel","Stubborn","Valiant"]},
  {id:"spells", name:"King of Spells", pt:"Rei dos Feitiços", color:"var(--k-spells)",
   c:{base:["Citadel"],troop:["Shaman","Warlock","Wizard"],tower:["Spire"],building:["Library"],ench:["Combustion","Static"],tome:["Offering"]},
   perks:["Arcane","Eldritch","Electric","Mystic","Ruthless","Scholar","Scrollmaster","Seer","Sorcerous"]},
  {id:"greed", name:"King of Greed", pt:"Rei da Ganância", color:"var(--k-greed)",
   c:{base:["Palace"],troop:["Thief","Mercenary"],tower:["Dispenser"],building:["Beacon","Vault"],ench:["Midas Touch","Over-invest"],tome:["Mortgage"]},
   perks:["Fixer","Goon","Nepobaby","Oligarch","Patron","Peddler","Planner","Smuggler","Tycoon"]},
  {id:"blood", name:"King of Blood", pt:"Rei do Sangue", color:"var(--k-blood)",
   c:{base:["Pagoda"],troop:["Bomber","Imp"],tower:["Mangler"],building:["Cemetery","Demon's Altar"],ench:["Carnage"],tome:["Oblation","Sacrifice"]},
   perks:["Blighted","Butcher","Cultist","Diabolical","Draculian","Explosive","Martyr","Pagan","Summoner"]},
  {id:"nature", name:"King of Nature", pt:"Rei da Natureza", color:"var(--k-nature)",
   c:{base:["Treant"],troop:["Boar","Elf"],tower:["Orchard"],building:["Forest","Mycelium"],ench:["Poison Vial"],tome:["Clone","Procreate"]},
   perks:["Ecofriendly","Elven","Gardener","Healer","Pollinator","Spreader","Tamer","Tenacious","Toxic"]},
  {id:"nomads", name:"King of Nomads", pt:"Rei dos Nômades", color:"var(--k-nomads)",
   c:{base:["Warlord"],troop:["Mob","Raptor"],tower:["Dragon's Den"],building:["Camp"],ench:["Frost"],tome:["Migration","Shields","Swords"]},
   perks:["Aggressive","Cold","Defensive","Immigrant","Jurassic","Khan","Leader","Rebellious","Reptilian"]},
  {id:"stone", name:"King of Stone", pt:"Rei da Pedra", color:"var(--k-stone)",

function normStages(L){
  const blank=()=>Array(GRID).fill(null);

  if(Array.isArray(L)) return [{year:null,cells:fix(L)}];
  if(L && Array.isArray(L.stages) && L.stages.length) return L.stages.map(x=>({year:Number.isFinite(+x.year)&&x.year!==null?+x.year:null,cells:fix(x.cells)}));
  return [{year:null,cells:blank()}];
}

const IMG_BUCKET="build-images";
const imgBase=()=>{ const u=(window.MESA_CONFIG||{}).supabaseUrl||""; return u.replace(/\/$/,"")+"/storage/v1/object/public/"+IMG_BUCKET+"/"; };
const IMG_RE=/^!\[([^\]]{0,200})\]\((https:\/\/[^)\s]+)\)$/;
function guideHTML(text){
  const base=imgBase();
  return (text||"").split(/\n\s*\n/).filter(x=>x.trim()).map(par=>{
    const lines=par.split("\n"); let out="", buf=[];
    const flush=()=>{ if(buf.length){ out+=`<p>${esc(buf.join("\n"))}</p>`; buf=[]; } };
    lines.forEach(line=>{
      const m=line.trim().match(IMG_RE);
      if(m && m[2].startsWith(base)){ flush(); out+=`<figure class="gimg"><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">${m[1]?`<figcaption>${esc(m[1])}</figcaption>`:""}</figure>`; }
      else buf.push(line);
    });
    flush(); return out;
  }).join("");
}
async function shrinkImage(file){
  // reduz imagens grandes para no máximo 1600px e converte para WebP
  if(file.type==="image/gif") return file;
  try{
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(scale===1 && file.size<1.5e6) return file;
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/webp",0.85));
    return blob && blob.size<file.size ? new File([blob],"img.webp",{type:"image/webp"}) : file;
  }catch(e){ return file; }
}
async function uploadGuideImage(file){
  const ok=["image/png","image/jpeg","image/webp","image/gif"];
  if(!ok.includes(file.type)) throw new Error(L("Use uma imagem PNG, JPG, WebP ou GIF.","Use a PNG, JPG, WebP or GIF image."));
  const f=await shrinkImage(file);
  if(f.size>5*1024*1024) throw new Error(L("A imagem passa de 5 MB.","The image is over 5 MB."));
  const ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif"}[f.type]||"png";
  const path=`${S.me.id}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await S.sb.storage.from(IMG_BUCKET).upload(path,f,{contentType:f.type,cacheControl:"31536000",upsert:false});
  if(error) throw new Error(L("Não foi possível enviar a imagem. Tente de novo.","Could not upload the image. Try again."));
  return imgBase()+path;
}

const NICK_RE=/^[A-Za-z0-9_À-ÿ .-]{3,24}$/;
function authMsg(e){
  const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login")) return L("E-mail ou senha incorretos.","Wrong e-mail or password.");
  if(m.includes("email not confirmed")) return L("Confirme seu e-mail pelo link que enviamos antes de entrar.","Confirm your e-mail with the link we sent before signing in.");
  if(m.includes("already registered")) return L("Esse e-mail já tem conta. Use Entrar.","This e-mail already has an account. Use Sign in.");
  if(m.includes("password")) return L("A senha precisa ter pelo menos 6 caracteres.","The password needs at least 6 characters.");
  if(m.includes("email rate limit")) return L("O site atingiu o limite de envio de e-mails de confirmação. Tente de novo mais tarde.","The site hit its confirmation e-mail limit. Try again later.");
  if(m.includes("rate limit")) return L("Muitas tentativas. Aguarde alguns minutos.","Too many attempts. Wait a few minutes.");
  if(e && e.code==="23505") return L("Esse nome de jogador já está em uso. Tente outro.","That player name is taken. Try another one.");
  return L("Não foi possível concluir agora. Tente de novo.","Something went wrong. Try again.");
}
function authModal(mode){
  if(!S.sb){ modal(`<h2>${L("Site sem conexão","Site offline")}</h2><p>${L("O banco de dados não está configurado. Confira o arquivo config.js.","The database is not configured. Check config.js.")}</p><div class="formbar"><button class="btn" data-close>${L("Fechar","Close")}</button></div>`); return; }
  const lab=(t,id,type,ph,ac)=>`<label style="display:grid;gap:6px;font-weight:500">${t}<input class="field" id="${id}" type="${type}" placeholder="${ph}" autocomplete="${ac}"></label>`;
  const body = mode==="up" ? `<h2>${L("Criar conta","Sign up")}</h2><p>${L("O nome de jogador aparece nas builds que você publicar.","Your player name shows on the builds you publish.")}</p>
      ${lab(L("Nome de jogador","Player name"),"aNick","text",L("ex.: ReiDoNada_BR","e.g. KingOfNothing"),"nickname")}${lab("E-mail","aMail","email",L("voce@email.com","you@email.com"),"email")}${lab(L("Senha","Password"),"aPass","password",L("mínimo de 6 caracteres","at least 6 characters"),"new-password")}`
    : mode==="nick" ? `<h2>${L("Escolha seu nome de jogador","Choose your player name")}</h2><p>${L("Ele aparece nas builds que você publicar.","It shows on the builds you publish.")}</p>${lab(L("Nome de jogador","Player name"),"aNick","text",L("ex.: ReiDoNada_BR","e.g. KingOfNothing"),"nickname")}`
    : `<h2>${L("Entrar","Sign in")}</h2>${lab("E-mail","aMail","email",L("voce@email.com","you@email.com"),"email")}${lab(L("Senha","Password"),"aPass","password",L("sua senha","your password"),"current-password")}`;
  const alt = mode==="in" ? `<button type="button" class="btn ghost" id="aAlt">${L("Criar conta","Sign up")}</button>` : mode==="up" ? `<button type="button" class="btn ghost" id="aAlt">${L("Já tenho conta","I have an account")}</button>` : "";
  modal(`<form id="aForm" style="display:grid;gap:14px" novalidate>${body}<div class="err" id="aErr" hidden></div>
    <div class="formbar">${alt}<span style="flex:1"></span><button type="button" class="btn ghost" data-close>${L("Cancelar","Cancel")}</button><button class="btn primary" id="aGo">${mode==="in"?L("Entrar","Sign in"):mode==="up"?L("Criar conta","Sign up"):L("Salvar","Save")}</button></div></form>`);
  const alt2=$("#aAlt"); if(alt2) alt2.onclick=()=>authModal(mode==="in"?"up":"in");
  const f=$("#aForm"); const first=f.querySelector("input"); first&&first.focus();
  const err=t=>{ const e=$("#aErr"); e.textContent=t; e.hidden=false; };
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const nick=($("#aNick")||{}).value?.trim(), mail=($("#aMail")||{}).value?.trim(), pass=($("#aPass")||{}).value;
    if(mode!=="in" && !NICK_RE.test(nick||"")) return err(L("Nome de jogador: 3 a 24 caracteres, sem símbolos especiais.","Player name: 3 to 24 characters, no special symbols."));
    if(mode!=="nick" && (!mail || !mail.includes("@"))) return err(L("Informe um e-mail válido.","Enter a valid e-mail."));
    if(mode==="up" && (pass||"").length<6) return err(L("A senha precisa ter pelo menos 6 caracteres.","The password needs at least 6 characters."));
    $("#aGo").disabled=true;
    try{
      if(mode==="in"){
        const {error}=await S.sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error;
        closeModal(); toast(L("Bem-vindo de volta!","Welcome back!"));
      } else if(mode==="up"){
        const {data:taken}=await S.sb.from("profiles").select("id").ilike("nick",nick.replace(/[%_]/g,"\\$&")).maybeSingle();
        if(taken) throw {code:"23505"};
        const {data,error}=await S.sb.auth.signUp({email:mail,password:pass,options:{data:{nick},emailRedirectTo:location.origin+location.pathname}});
        if(error) throw error;
        if(data.session){ closeModal(); toast(L("Conta criada. Bem-vindo, ","Account created. Welcome, ")+nick+"!"); }
        else modal(`<h2>${L("Confirme seu e-mail","Confirm your e-mail")}</h2><p>${L("Enviamos um link para","We sent a link to")} <strong>${esc(mail)}</strong>. ${L("Depois de confirmar, volte aqui e clique em Entrar.","After confirming, come back and click Sign in.")}</p><div class="formbar"><button class="btn primary" data-close>${L("Entendi","Got it")}</button></div>`);
      } else {
        const {error}=await S.sb.from("profiles").insert({id:S.me.id,nick}); if(error) throw error;
        S.profile={nick}; closeModal(); render(); toast(L("Pronto, ","Done, ")+nick+"!");
      }
    }catch(e){ err(authMsg(e)); const b=$("#aGo"); if(b) b.disabled=false; }
  };
}

  $("#sort").onchange=e=>{ S.sort=e.target.value; render(); };
  app.querySelectorAll(".li").forEach(r=>r.onclick=()=>go("build", r.dataset.key));
  const en=$("#emptyNew"); if(en) en.onclick=()=>openEditor(null);
}

function gridHTML(layout, interactive){
  const cells=[];
  for(let i=0;i<GRID;i++){
    const c=layout && layout[i]; const name=c && c.card;
    const col=name?kcol(name):"var(--ink-3)";
    const ench=(c&&c.ench)||[], tot=enchTotal(c);
    const cls=`cell ${name?"full":""} ${tot?"enchanted":""} ${i===CENTER?"center":""} ${interactive&&S.selCell===i?"sel":""}`;
    const gems = tot?`<span class="ench" aria-hidden="true">${ench.slice(0,3).map(e=>`<i style="--ec:${kcol(e.card)}"></i>`).join("")}<b>×${tot}</b></span>`:"";
    const tip = name?cardName(name)+(tot?" + "+ench.map(e=>cardName(e.card)+" ×"+(e.n||1)).join(", "):""):"";
    const inner = name?`${gems}<span>${esc(cardName(name))}</span>${c.lv?`<span class="lv">${L("Nv","Lv")}${esc(c.lv)}</span>`:""}`:(i===CENTER?"<span>Base</span>":"");
    cells.push(interactive
      ? `<button type="button" class="${cls}" style="--kc:${col}" data-cell="${i}" title="${esc(tip)}" aria-label="${L("Casa","Slot")} ${i+1}${name?": "+esc(tip):L(" vazia"," empty")}">${inner}</button>`
      : `<div class="${cls}" style="--kc:${col}" title="${esc(tip)}">${inner}</div>`);
  }
  return `<div class="kgrid">${cells.join("")}</div>`;
}

function enchListHTML(layout){
  const rows=(layout||[]).map((c,i)=>({c,i})).filter(x=>x.c && enchTotal(x.c));
  if(!rows.length) return "";
  return `<div class="enchlist"><h3>${L("Encantamentos","Enchantments")}</h3>${rows.map(({c,i})=>`
    <div class="erow"><span class="etroop" style="--kc:${kcol(c.card)}"><i></i>${esc(cardName(c.card))} <small>${L("casa","slot")} ${i+1}</small></span>
      <span class="echips">${c.ench.map(e=>`<span class="echip" style="--ec:${kcol(e.card)}"><i></i>${esc(cardName(e.card))} <b>×${e.n||1}</b></span>`).join("")}</span></div>`).join("")}</div>`;
}

/* ---------- Writes ---------- */
async function vote(key, val){
  if(!loggedIn()){ login(); return; }
  const prev=S.myVotes[key]||0, b=S.builds.find(x=>x.key===key);
  // atualização otimista
  if(b){ const t=b.t; if(prev===1)t.up--; if(prev===-1)t.down--; if(val===1)t.up++; if(val===-1)t.down++; t.score=t.up-t.down; }
  if(val) S.myVotes[key]=val; else delete S.myVotes[key];
  render();
  const q = val ? S.sb.from("votes").upsert({build_id:key,user_id:S.me.id,value:val})
                : S.sb.from("votes").delete().eq("build_id",key).eq("user_id",S.me.id);
  const {error}=await q;
  if(error){ toast(writeErr(error)); }
  refresh();
}
async function saveBuild(id, rec){
  const q = id ? S.sb.from("builds").update(rec).eq("id",id).select("id").single()
               : S.sb.from("builds").insert({...rec, owner:S.me.id}).select("id").single();
  const {data,error}=await q; if(error) throw error;
  await loadBuilds(); return data.id;
}
async function deleteBuild(id){
  const {error}=await S.sb.from("builds").delete().eq("id",id); if(error) throw error;
  await loadBuilds();
}

    : {id:null,title:"",king:"nothing",patch:"",summary:"",guide:"",perks:[],tags:[],stages:[{year:1,cells:Array(GRID).fill(null)}]};

  </form>`;

  const sync=()=>{ d.title=$("#fTitle").value; d.patch=$("#fPatch").value; d.summary=$("#fSum").value; d.guide=$("#fGuide").value; };
  const rerender=()=>{ sync(); const y=window.scrollY; render(); window.scrollTo(0,y); };
  $("#bk").onclick=$("#cancel").onclick=()=>{ const id=d.id; S.draft=null; id?go("build",id):go("home"); };
  $("#fKing").onchange=e=>{ const old=KMAP[d.king]; d.king=e.target.value; d.perks=[];
    const nk=KMAP[d.king]; const c=d.layout[CENTER]; if(!c || c.card===old.base) d.layout[CENTER]={card:nk.base,lv:(c&&c.lv)||1}; rerender(); };
  app.querySelectorAll("[data-perk]").forEach(b=>b.onclick=()=>{ const p=b.dataset.perk; d.perks=d.perks.includes(p)?d.perks.filter(x=>x!==p):[...d.perks,p]; rerender(); });
  app.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{ const p=b.dataset.tag; d.tags=d.tags.includes(p)?d.tags.filter(x=>x!==p):[...d.tags,p]; rerender(); });

  /* grid actions shared by click and drag */
  const placeCard=(i,card)=>{ const cur=d.layout[i]; const keep=cur && CARD_TYPE[card]==="troop" && CARD_TYPE[cur.card]==="troop";
    d.layout[i]={card, lv:(cur&&cur.lv)||1, ench: keep?(cur.ench||[]):[]}; };
  const addEnch=(i,card)=>{ const cur=d.layout[i];
    if(!cur || CARD_TYPE[cur.card]!=="troop"){ toast(L("Encantamentos só vão por cima de uma tropa.","Enchantments only go on top of a troop.")); return false; }
    const list=cur.ench=(cur.ench||[]); const e=list.find(x=>x.card===card); if(e) e.n=(e.n||1)+1; else list.push({card,n:1}); return true; };
  const moveCell=(from,to)=>{ if(from===to) return; const a=d.layout[from]; d.layout[from]=d.layout[to]; d.layout[to]=a; };

  let justDragged=false;
  app.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{ if(justDragged) return; S.selCell=+b.dataset.cell; rerender(); });
  app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{ if(justDragged) return; placeCard(S.selCell,b.dataset.card);
    const nxt=d.layout.findIndex((c,i)=>!c && i>S.selCell); if(nxt>-1) S.selCell=nxt; rerender(); });
  app.querySelectorAll("[data-ench]").forEach(b=>b.onclick=()=>{ if(justDragged) return; if(addEnch(S.selCell,b.dataset.ench)) rerender(); });
  app.querySelectorAll("[data-einc]").forEach(b=>b.onclick=()=>{ const e=sel.ench[+b.dataset.einc]; e.n=(e.n||1)+1; rerender(); });
  app.querySelectorAll("[data-edec]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.edec, e=sel.ench[j]; if((e.n||1)>1) e.n--; else sel.ench.splice(j,1); rerender(); });

  /* pointer drag: palette cards, enchantments and filled grid cells */
  const startDrag=(ev, src)=>{
    if(ev.button>0) return;
    if(!src.dataset.cell && ev.pointerType==="touch") return; // palette scrolls on touch; tap to place instead
    const x0=ev.clientX, y0=ev.clientY; let ghost=null, over=null;
    const label = cardName(src.dataset.card||src.dataset.ench||(d.layout[+src.dataset.cell]||{}).card||"");
    if(!label) return;
    const col = src.dataset.ench?kcol(src.dataset.ench):kcol(label);
    const move=e=>{
      if(!ghost){ if(Math.hypot(e.clientX-x0,e.clientY-y0)<6) return;
        ghost=document.createElement("div"); ghost.className="dragghost"+(src.dataset.ench?" isench":""); ghost.style.setProperty("--kc",col); ghost.textContent=label; document.body.appendChild(ghost);
        src.classList.add("dragging"); }
      e.preventDefault();
      ghost.style.transform=`translate(${e.clientX+10}px,${e.clientY+10}px)`;
      const t=document.elementFromPoint(e.clientX,e.clientY); const cell=t&&t.closest("[data-cell]");
      if(over!==cell){ over&&over.classList.remove("dropover"); over=cell; over&&over.classList.add("dropover"); }
    };
    const up=()=>{
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",up);
      if(!ghost) return;
      ghost.remove(); src.classList.remove("dragging"); justDragged=true; setTimeout(()=>justDragged=false,0);
      if(!over) return;
      const to=+over.dataset.cell;
      if(src.dataset.cell!==undefined) moveCell(+src.dataset.cell,to);
      else if(src.dataset.card) placeCard(to,src.dataset.card);
      else if(src.dataset.ench && !addEnch(to,src.dataset.ench)) return;
      S.selCell=to; rerender();
    };
    window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  };
  app.querySelectorAll("[data-card],[data-ench],.cell.full[data-cell]").forEach(el=>el.addEventListener("pointerdown",e=>startDrag(e,el)));
  const lv=$("#fLv"); if(lv) lv.onchange=()=>{ d.layout[S.selCell].lv=+lv.value; rerender(); };
  const clr=$("#clr"); if(clr) clr.onclick=()=>{ d.layout[S.selCell]=null; rerender(); };
  const pq=$("#pq"); pq.oninput=()=>{ S.pq=pq.value; rerender(); const n=$("#pq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };

  app.querySelectorAll("[data-sy]").forEach(t=>t.onclick=()=>{ S.stageIdx=+t.dataset.sy; S.selCell=CENTER; rerender(); });
  $("#addYear").onclick=()=>{
    const cur=d.stages[S.stageIdx]; const maxY=Math.max(0,...d.stages.map(x=>x.year||0));
    d.stages.push({year:Math.min(99,maxY+5), cells:JSON.parse(JSON.stringify(cur.cells))});
    S.stageIdx=d.stages.length-1; rerender(); };
  const fy=$("#fYear"); fy.oninput=()=>{ const v=parseInt(fy.value,10); d.stages[S.stageIdx].year = v>=1&&v<=99 ? v : null; }; fy.onchange=()=>rerender();
  const dy=$("#delYear"); if(dy) dy.onclick=()=>{ d.stages.splice(S.stageIdx,1); S.stageIdx=Math.max(0,S.stageIdx-1); rerender(); };
  const ta=$("#fGuide"), gMsg=$("#gImgMsg");
  const insertImage=async file=>{
    const pos=ta.selectionStart??ta.value.length; sync();
    gMsg.textContent=L("Enviando imagem…","Uploading image…"); $("#gImgBtn").disabled=true;
    try{
      const url=await uploadGuideImage(file);
      const before=d.guide.slice(0,pos), after=d.guide.slice(pos);
      const pre=before && !before.endsWith("\n\n") ? (before.endsWith("\n")?"\n":"\n\n") : "";
      ta.value=before+pre+`![](${url})`+"\n\n"+after.replace(/^\n+/,"");
      rerender(); toast(L("Imagem adicionada.","Image added."));
    }catch(err){ gMsg.textContent=err.message; $("#gImgBtn").disabled=false; }
  };
  $("#gImgBtn").onclick=()=>$("#gFile").click();
  $("#gFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) insertImage(f); };
  ta.addEventListener("paste",e=>{ const it=[...(e.clipboardData?.items||[])].find(x=>x.kind==="file"&&x.type.startsWith("image/"));
    if(it){ e.preventDefault(); insertImage(it.getAsFile()); } });
  $("#ef").onsubmit=async e=>{
    e.preventDefault(); sync();
    if(d.title.trim().length<4){ S.editErr=L("Dê um título com pelo menos 4 caracteres.","Use a title with at least 4 characters."); return rerender(); }
    if(d.stages.some(x=>!x.cells.some(Boolean))){ S.editErr=L("Todo ano precisa de pelo menos uma carta no reino. Remova os anos vazios.","Every year needs at least one card. Remove empty years."); return rerender(); }
    const ys=d.stages.map(x=>x.year).filter(Boolean);
    if(d.stages.length>1 && ys.length!==d.stages.length){ S.editErr=L("Informe o número do ano em cada reino.","Enter the year number for each kingdom."); return rerender(); }
    if(new Set(ys).size!==ys.length){ S.editErr=L("Há dois reinos com o mesmo ano.","Two kingdoms have the same year."); return rerender(); }
    $("#saveBtn").disabled=true;
    const rec={title:d.title.trim(),king:d.king,patch:d.patch.trim(),summary:d.summary.trim(),guide:d.guide.trim(),
      perks:d.perks,tags:d.tags,layout:{stages:[...d.stages].sort((a,b)=>(a.year||0)-(b.year||0)).map(x=>({year:x.year||null,
        cells:x.cells.map(c=>c?{card:c.card,lv:c.lv||1,ench:(CARD_TYPE[c.card]==="troop"?(c.ench||[]):[]).map(e=>({card:e.card,n:e.n||1}))}:null)}))}};
    try{
      const newId=await saveBuild(d.id, rec);
      S.draft=null; S.editErr=""; toast(d.id?L("Build atualizada.","Build updated."):L("Build publicada!","Build published!")); go("build", newId);
    }catch(err){ S.editErr=writeErr(err); rerender(); }
  };
}

/* ---------- Boot ---------- */
(function(){
  const h=(location.hash||"").replace(/^#/,"");
  if(h.startsWith("b-")){ S.view="build"; S.buildKey=h.slice(2); }
  render();
})();

(async()=>{
  const cfg=window.MESA_CONFIG||{};
  if(!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey || cfg.supabaseUrl.includes("SEU-PROJETO")){
    S.dbDown=true; S.loaded.builds=true; render(); return;
  }
  S.sb=window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const {data:{session}}=await S.sb.auth.getSession();
  S.session=session; S.me.id=session?.user?.id||null;
  await Promise.all([loadBuilds(), loadMine()]);
  render();
  S.sb.auth.onAuthStateChange(async(ev,session)=>{
    if(ev==="INITIAL_SESSION" || ev==="TOKEN_REFRESHED") return;
    S.session=session; S.me.id=session?.user?.id||null;
    // evita chamar o banco dentro do callback de auth
    setTimeout(async()=>{ await loadMine(); await loadBuilds();
      if(S.view==="edit" && !loggedIn()){ S.draft=null; S.view="home"; }
      render(); },0);
  });
  window.addEventListener("focus",()=>{ if(S.view!=="edit") refresh(); });
})();
</script>
</body>
</html>
